<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Controle interno de beneficios da EHTL">
  <title>EHTL Beneficios | Controle de RH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegacao principal">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div><strong>EHTL</strong><span>Beneficios</span></div>
      </div>
      <div class="sidebar-label">Operacao</div>
      <nav id="main-nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">01</span>Dashboard</button>
        <button class="nav-item" data-view="employees"><span class="nav-icon">02</span>Colaboradores</button>
        <button class="nav-item" data-view="benefits"><span class="nav-icon">03</span>Beneficios</button>
        <button class="nav-item" data-view="dependents"><span class="nav-icon">04</span>Dependentes</button>
        <button class="nav-item" data-view="documents"><span class="nav-icon">05</span>Atestados</button>
      </nav>
      <div class="sidebar-label">Gestao</div>
      <nav>
        <button class="nav-item" data-view="competencies"><span class="nav-icon">06</span>Competencias</button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">07</span>Relatorios</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">08</span>Configuracoes</button>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <div><strong>Ambiente de testes</strong><small>Dados ficticios ativos</small></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>RH</span><b>/</b><strong id="page-title">Dashboard</strong></div>
        <div class="topbar-actions">
          <label class="competency-picker">Competencia
            <select id="competency-select" aria-label="Selecionar competencia">
              <option value="2026-09">Setembro 2026</option>
              <option value="2026-08">Agosto 2026</option>
            </select>
          </label>
          <button class="icon-button" title="Notificacoes" aria-label="Notificacoes"><span class="notification-dot"></span>!</button>
          <div class="user-chip"><span>TB</span><div><strong>Thaina Barros</strong><small>Administradora</small></div></div>
        </div>
      </header>
      <div id="app" class="view-container"></div>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
